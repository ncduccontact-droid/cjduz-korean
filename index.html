<!DOCTYPE html>
<html lang="vi" data-theme="jade_grad">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0D9488" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="D ● TOPIK" />
  <title>D ● TOPIK · Tiếng Hàn Tổng Hợp &amp; Luyện Thi TOPIK</title>
  <link rel="icon" type="image/png" href="/media/d_topik_mascot.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/media/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/css/migii.css?v=20261127-13" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="migii-navbar">
    <div class="navbar-inner">
      <div class="brand-logo" id="brand-home-btn" role="button" tabindex="0" aria-label="D ● TOPIK Trang chủ">
        <img src="/media/d_topik_logo.png" alt="D ● TOPIK" class="brand-logo-img" />
      </div>

      <nav class="nav-links" aria-label="Điều hướng chính">
        <button type="button" class="nav-pill active" data-route="home"><span data-dico="home"></span><span>Trang chủ</span></button>
        <button type="button" class="nav-pill" data-route="theory"><span data-dico="book"></span><span>Lý thuyết</span></button>
        <button type="button" class="nav-pill" data-route="roadmap"><span data-dico="compass"></span><span>Lộ trình</span></button>

        <div class="nav-item-wrap">
          <button type="button" class="nav-pill" data-route="practice"><span data-dico="video"></span><span>Luyện tập ▾</span></button>
          <div class="nav-dropdown">
            <button type="button" class="dropdown-link" data-route="practice" data-sub="skills">Bài tập &amp; Dịch câu</button>
            <button type="button" class="dropdown-link" data-route="theory" data-sub="grammar-list">Ngữ pháp &amp; So sánh</button>
            <button type="button" class="dropdown-link" data-route="practice" data-sub="topik1">Luyện dạng TOPIK I</button>
            <button type="button" class="dropdown-link" data-route="practice" data-sub="topik2">Luyện dạng TOPIK II</button>
          </div>
        </div>

        <div class="nav-item-wrap">
          <button type="button" class="nav-pill" data-route="mock-test"><span data-dico="exam"></span><span>Đề thi ▾</span></button>
          <div class="nav-dropdown">
            <button type="button" class="dropdown-link" data-route="mock-test" data-sub="topik1" data-vmode="exams" data-cat="curated">Đề tuyển chọn</button>
            <button type="button" class="dropdown-link" data-route="mock-test" data-sub="topik1" data-vmode="exams" data-cat="all">TOPIK I (70 câu)</button>
            <button type="button" class="dropdown-link" data-route="mock-test" data-sub="topik2" data-vmode="exams" data-cat="all">TOPIK II (104 câu)</button>
            <button type="button" class="dropdown-link" data-route="mock-test" data-sub="topik1" data-vmode="segments">Luyện từng dạng</button>
          </div>
        </div>

        <button type="button" class="nav-pill" data-route="check-tools"><span data-dico="sparkle"></span><span>Công cụ</span></button>
      </nav>

      <div class="nav-actions">
        <div class="streak-pill" id="nav-streak" title="Chuỗi ngày học">
          <span id="streak-ico"></span>
          <span id="streak-count">1 ngày</span>
        </div>

        <div class="theme-Menu-wrap" id="theme-menu-wrap">
          <button class="btn-theme-pill" id="btn-theme-toggle" type="button" title="Đổi dải màu Xanh Ngọc" aria-label="Đổi dải màu Xanh Ngọc">
            <span id="theme-ico"></span>
            <span class="hide-sm">Màu</span>
          </button>
          <div class="theme-popover" id="theme-popover"></div>
        </div>

        <button class="btn-quick-dict" id="open-quick-tool-btn" type="button" aria-label="Tra từ điển và chia động từ">
          <span id="search-ico"></span>
          <span class="hide-sm">Tra từ</span>
        </button>

        <button class="user-auth-pill" id="open-auth-btn" type="button" title="Đồng bộ theo tài khoản">
          <span class="cloud-dot" id="cloud-sync-dot"></span>
          <span id="nav-user-label">Tài khoản</span>
        </button>
      </div>
    </div>
  </header>

  <div id="trial-banner-slot"></div>

  <main id="app-root" style="min-height: calc(100vh - 210px);"></main>

  <div id="bottom-support-slot"></div>

  <nav class="mobile-bottom-nav" aria-label="Điều hướng di động">
    <button type="button" class="mobile-tab-btn active" data-mroute="home">
      <span class="m-ico" data-mico="home"></span><span>Trang chủ</span>
    </button>
    <button type="button" class="mobile-tab-btn" data-mroute="theory">
      <span class="m-ico" data-mico="book"></span><span>Lý thuyết</span>
    </button>
    <button type="button" class="mobile-tab-btn" data-mroute="practice">
      <span class="m-ico" data-mico="video"></span><span>Luyện tập</span>
    </button>
    <button type="button" class="mobile-tab-btn" data-mroute="mock-test">
      <span class="m-ico" data-mico="exam"></span><span>Đề thi</span>
    </button>
    <button type="button" class="mobile-tab-btn" data-mroute="roadmap">
      <span class="m-ico" data-mico="compass"></span><span>Lộ trình</span>
    </button>
    <button type="button" class="mobile-tab-btn" data-mroute="check-tools">
      <span class="m-ico" data-mico="sparkle"></span><span>Công cụ</span>
    </button>
  </nav>

  <div id="modal-root"></div>

  <footer class="migii-footer">
    <div class="footer-inner">
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="footer-mascot"></span>
        <strong style="color:var(--text-main);">D <span style="color:var(--primary);">●</span> TOPIK · Tiếng Hàn Tổng Hợp &amp; Luyện Thi TOPIK</strong>
      </div>
      <div style="font-weight:500;color:var(--text-muted);" id="footer-sync-badge">
        Lưu tiến độ tự động
      </div>
    </div>
  </footer>

  <script type="module" src="/js/app.js?v=20261127-13"></script>
</body>
</html>
